[build]
  command   = "bash build.sh"
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."session-calendar-sync"]
  schedule = "*/5 * * * *"

[functions."session-communications"]
  schedule = "*/5 * * * *"

[functions."payment-email-reconcile"]
  schedule = "*/30 * * * *"

# Keep the canonical dashboard URL on the current P1 practitioner workspace.
# The legacy dashboard.html file remains in the tree until its references are
# fully retired, but production serves the P1 shell at the bookmarked URL.
[[redirects]]
  from = "/dashboard.html"
  to = "/dashboard-p1.html"
  status = 200
  force = true

# Keep legacy booking links working while the homepage form is the single
# public booking experience.
[[redirects]]
  from = "/book"
  to = "/#contact"
  status = 301
  force = true

[[redirects]]
  from = "/book.html"
  to = "/#contact"
  status = 301
  force = true
