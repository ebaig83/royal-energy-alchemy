[build]
  command   = "bash build.sh"
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."session-calendar-sync"]
  schedule = "*/5 * * * *"

[functions."session-communications"]
  schedule = "*/5 * * * *"

[functions."payment-email-reconcile"]
  schedule = "*/30 * * * *"

# Keep the canonical dashboard URL on the current P1 practitioner workspace.
# The legacy dashboard.html file remains in the tree until its references are
# fully retired, but production serves the P1 shell at the bookmarked URL.
[[redirects]]
  from = "/dashboard.html"
  to = "/dashboard-p1.html"
  status = 200
  force = true

# The catalog-driven booking page is the canonical public booking experience.
# Keep the short route as a stable alias without sending visitors to the
# separate homepage inquiry form.
[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 301
  force = true

[functions."expire-website-bookings"]
  schedule = "*/10 * * * *"
