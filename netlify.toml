[build]
  command   = "bash build.sh"
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."session-calendar-sync"]
  schedule = "*/5 * * * *"

[functions."session-communications"]
  schedule = "*/5 * * * *"

# Keep legacy booking links working while the homepage form is the single
# public booking experience.
[[redirects]]
  from = "/book"
  to = "/#contact"
  status = 301
  force = true

[[redirects]]
  from = "/book.html"
  to = "/#contact"
  status = 301
  force = true
